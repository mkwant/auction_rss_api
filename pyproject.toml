[project]
name = "auction-rss-api"
version = "1.90.0"
description = "This API returns RSS feeds for the search results of auction sites, online record stores and concert venues."
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "asgi-correlation-id==5.0.1",
    "beautifulsoup4==4.15.0",
    "cashews==7.6.0",
    "cryptography==50.0.2",
    "curl-cffi==0.16.3",
    "dateparser==1.4.3",
    "diskcache==5.6.3",
    "fastapi-rss==0.5.0",
    "fastapi[standard]==0.148.0",
    "httpx2==2.14.0",
    "nest-asyncio2==1.7.4",
    "packaging==26.3",
    "playwright==1.64.0",
    "playwright-stealth==2.0.3",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
    "rich==15.0.0",
    "starlette==1.9.0",
    "truststore==0.10.5",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "ruff==0.17.1",
    "ty==0.0.89",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F", "S", "I"]
