[project]
name = "auction-rss-api"
version = "1.77.13"
description = "This API returns RSS feeds for the search results of auction sites, online record stores and concert venues."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asgi-correlation-id>=5.0.1",
    "beautifulsoup4>=4.15.0",
    "cashews>=7.5.0",
    "cloudscraper>=1.2.71",
    "cryptography>=50.0.0",
    "curl-cffi>=0.16.0",
    "dateparser>=1.4.1",
    "diskcache>=5.6.3",
    "fastapi-rss>=0.5.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "nest-asyncio2>=1.7.2",
    "packaging>=26.2",
    "playwright>=1.62.0",
    "playwright-stealth>=2.0.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "starlette>=1.3.1",
    "truststore>=0.10.4",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
    "ty>=0.0.65",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F", "S", "I"]
